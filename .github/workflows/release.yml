name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CMAKE_POLICY_FLAGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5

jobs:
  bundle-linux:
    name: Bundle Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev libjack-dev \
            libdbus-1-dev libudev-dev \
            libfreetype-dev libharfbuzz-dev \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Print tool versions
        run: |
          cmake --version
          ninja --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          ${{ env.CMAKE_POLICY_FLAGS }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Assemble bundle
        run: |
          HASH=$(git rev-parse --short=8 HEAD)
          BUNDLE_DIR="bundle/ddlc-${HASH}"
          mkdir -p "$BUNDLE_DIR"
          cp build/bin/ddlc_afterstory "$BUNDLE_DIR/"
          cp -r content "$BUNDLE_DIR/"
          chmod +x "$BUNDLE_DIR/ddlc_afterstory"
          echo "$HASH" > "$BUNDLE_DIR/VERSION"
          tar -czf "ddlc-afterstory-linux-${HASH}.tar.gz" -C bundle "ddlc-${HASH}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ddlc-afterstory-linux-*.tar.gz

  bundle-windows:
    name: Bundle Windows
    runs-on: windows-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Print tool versions
        run: |
          cmake --version
          ninja --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          ${{ env.CMAKE_POLICY_FLAGS }}

      - name: Build
        run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS

      - name: Assemble bundle
        shell: pwsh
        run: |
          $hash = (git rev-parse --short=8 HEAD).Trim()
          $bundleDir = "bundle\ddlc-$hash"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null

          Copy-Item "build\bin\ddlc_afterstory.exe" -Destination $bundleDir
          Copy-Item -Path content -Destination "$bundleDir\content" -Recurse
          Set-Content -Path "$bundleDir\VERSION" -Value $hash

          Compress-Archive -Path "$bundleDir\*" -DestinationPath "ddlc-afterstory-windows-$hash.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ddlc-afterstory-windows-*.zip

  publish:
    name: Create GitHub Release
    needs: [bundle-linux, bundle-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release-linux/*
            artifacts/release-windows/*
